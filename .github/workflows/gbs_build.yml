name: "Build Test - Tizen/GBS"

# ${{ github.event.pull_request.commits }} : # commits in this PR
# - changed_file_list in GITHUB_ENV: the list of files updated in this pull-request.

on:
  push:
    branches: [ tmp/gbs-fp16 ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tizen GBS build on Ubuntu
    strategy:
      matrix:
        include:
          - gbs_build_arch: "aarch64"
            gbs_build_option: "--define \"unit_test 0\" --define \"enable_fp16 1\""

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: Force rebuild
      run: echo "rebuild=1" >> $GITHUB_ENV
    - uses: actions/setup-python@v1

    - name: prepare GBS
      if: env.rebuild == '1'
      run: |
        echo "deb [trusted=yes] http://download.tizen.org/tools/latest-release/Ubuntu_22.04/ /" | sudo tee /etc/apt/sources.list.d/tizen.list
        sudo apt-get update && sudo apt-get install -y gbs
        cp .github/workflows/tizen.gbs.conf ~/.gbs.conf

    - name: get date
      id: get-date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: restore gbs cache from main branch
      if: env.rebuild == '1'
      uses: actions/cache/restore@v4
      with:
        path: ~/GBS-ROOT/local/cache
        key: gbs-cache-${{ matrix.gbs_build_arch }}-${{ steps.get-date.outputs.date }}
        restore-keys: |
          gbs-cache-${{ matrix.gbs_build_arch }}-

    - name: run GBS
      if: env.rebuild == '1'
      run: |
        gbs build --skip-srcrpm --define "_skip_debug_rpm 1" -A ${{ matrix.gbs_build_arch }} ${{ matrix.gbs_build_option }}

    - name: list fp16 headers in devel rpm
      if: always()
      run: |
        find ~/GBS-ROOT/local/repos -name 'nntrainer-devel-[0-9]*.rpm' | tee /tmp/devel.txt
        for r in $(cat /tmp/devel.txt); do rpm2cpio "$r" | cpio -t 2>/dev/null | grep -E 'hgemm|mask_neon|matrix_transpose_kernels|f16|half_tensor' ; done || true
        grep -rhE 'enable-fp16|march=' ~/GBS-ROOT/local/BUILD-ROOTS/scratch.aarch64.0/home/abuild/rpmbuild/BUILD/*/build/meson-logs/meson-log.txt 2>/dev/null | head -5 || true

    # Disabled: nnstreamer/api/mlagent tests are unstable on Tizen CI
